server:
  port: 8083
management:
  tracing:
    sampling:
      probability: 1.0
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
spring:
  application:
    name: apiGW
  zipkin:
    base-url : http://localhost:9411
  cloud:
    gateway:
      routes:
        - id:customer
        - uri : lb://CUSTOMER
          predicates:
            - Path = /api/v1/customer/*
        - id:fraud
        - uri: lb://FRAUD
          predicates:
            - Path = /api/v1/fraud/*
        - id:notification
        - uri: lb://NOTIFICATION
          predicates:
            - Path = /api/v1/notification/*